<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Menu')}"></head>

<body>

<nav th:replace="~{fragments :: nav('products')}"></nav>

<main>

 <h1>Our Menu</h1>

 <p style="color:var(--muted);margin-top:-1rem;margin-bottom:2rem;">
  Manage your bakery products, prices and available stock.
 </p>


 <div class="grid">


  <!-- ADD PRODUCT -->

  <section class="card">

   <h2 th:text="${item == null} ? 'Add a Product' : 'Edit Product'">
    Add Product
   </h2>


   <p class="notice err" th:if="${error}" th:text="${error}"></p>
   <p class="notice ok" th:if="${saved}" th:text="${saved}"></p>

   <form method="post"
         action="/admin/products/save"
         enctype="multipart/form-data">

    <input type="hidden"
           name="id"
           th:value="${item?.id}">


    <label for="category">
     Category
    </label>

    <select id="category"
            name="category">

     <option th:each="c : ${ {'CAKE','PASTRY','BREAD'} }"
             th:value="${c}"
             th:text="${c}"
             th:selected="${item != null and item.category == c}">
     </option>

    </select>


    <label for="name">
     Product name
    </label>

    <input id="name"
           name="name"
           required
           placeholder="e.g. Chocolate Cake"
           th:value="${item?.name}">


    <label for="price">
     Price (Rs.)
    </label>

    <input id="price"
           name="price"
           type="number"
           step="0.01"
           min="0"
           required
           placeholder="3500"
           th:value="${item?.price}">


    <label for="stock">
     Available stock
    </label>

    <input id="stock"
           name="stock"
           type="number"
           min="0"
           required
           placeholder="10"
           th:value="${item?.stock}">


    <label for="detail">
     Flavour / filling / type
    </label>

    <input id="detail"
           name="detail"
           placeholder="e.g. Chocolate cream"
           th:value="${item?.detail}">


    <label for="photo">
     Product photo
    </label>

    <div class="photo-box" th:with="cur=${item == null ? null : images.forProduct(item)}">

     <img id="photoPreview"
          class="photo-preview"
          th:src="${cur != null} ? @{${cur}} : '#'"
          th:hidden="${cur == null}"
          alt="Product photo preview">

     <input id="photo"
            name="photo"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif">

     <small class="hint"
            th:text="${item == null} ? 'JPG, PNG, WEBP or GIF, up to 5 MB.' : 'Choose a new photo only if you want to replace the current one.'">
      JPG, PNG, WEBP or GIF, up to 5 MB.
     </small>

    </div>


    <div class="form-actions">

     <button class="btn"
             type="submit"
             th:text="${item == null} ? '🍰 Add Product' : '💾 Save Changes'">
      Save
     </button>

     <a class="btn ghost"
        th:if="${item != null}"
        href="/admin/products">
      Cancel
     </a>

    </div>

   </form>

  </section>


  <!-- PRODUCT LIST -->

  <section class="card">

   <form class="search"
         method="get">

    <input name="q"
           th:value="${q}"
           placeholder="🔍 Search products..."
           aria-label="Search products">

    <button class="btn"
            type="submit">
     Search
    </button>

   </form>


   <div class="wrap">

    <table>

     <thead>

     <tr>
      <th>Photo</th>
      <th>Name</th>
      <th>Category</th>
      <th>Detail</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
     </tr>

     </thead>


     <tbody>

     <tr th:each="p : ${items}">

      <td th:with="img=${images.forProduct(p)}">

       <img class="admin-thumb"
            th:if="${img != null}"
            th:src="@{${img}}"
            th:alt="${p.name}">

       <span class="admin-thumb none"
             th:unless="${img != null}">🍰</span>

      </td>

      <td>

       <strong th:text="${p.name}">
        Product
       </strong>

      </td>


      <td>

                            <span class="badge"
                                  th:text="${p.category}">
                                CAKE
                            </span>

      </td>


      <td th:text="${p.detail}">
       Detail
      </td>


      <td>

       Rs.

       <span th:text="${#numbers.formatDecimal(p.price,1,2)}">
                                0.00
                            </span>

      </td>


      <td th:text="${p.stock}">
       0
      </td>


      <td>

       <a class="btn sm ghost"
          th:href="@{/admin/products(edit=${p.id})}">
        Edit
       </a>


       <form class="inline"
             method="post"
             th:action="@{/admin/products/delete/{id}(id=${p.id})}"
             onsubmit="return confirm('Delete this product?')">

        <button class="btn sm"
                type="submit">
         Delete
        </button>

       </form>

      </td>

     </tr>

     </tbody>

    </table>

   </div>


   <p class="empty"
      th:if="${#lists.isEmpty(items)}">

    🍰 No products yet.
    Add your first bakery product on the left.

   </p>

  </section>

 </div>
</main>

<script>
 (function () {
  var input = document.getElementById('photo');
  var preview = document.getElementById('photoPreview');
  if (!input || !preview) return;
  input.addEventListener('change', function () {
   var f = input.files && input.files[0];
   if (!f) return;
   if (f.size > 5 * 1024 * 1024) {
    alert('This photo is larger than 5 MB. Please choose a smaller one.');
    input.value = '';
    return;
   }
   preview.src = URL.createObjectURL(f);
   preview.hidden = false;
  });
 })();
</script>

</body>
</html>
