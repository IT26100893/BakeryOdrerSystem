<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My profile')}"></head>
<body>
<nav th:replace="~{fragments :: nav('profile')}"></nav>
<main>
  <h1>My profile</h1>
  <div class="error" th:if="${error}" th:text="${error}" role="alert"></div>
  <div class="ok" th:if="${msg}" th:text="${msg}" role="status"></div>
  <section class="card auth">
    <h2>My details</h2>
    <form method="post" th:action="@{/customer/profile}">
      <label for="name">Full name</label>
      <input id="name" name="name" required th:value="${me.name}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required th:value="${me.email}">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" required th:value="${me.phone}">
      <label for="password">New password (leave blank to keep the current one)</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="new-password">
      <div class="form-actions"><button class="btn" type="submit">Save changes</button></div>
    </form>
  </section>
</main>
</body></html>
